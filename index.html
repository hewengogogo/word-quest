<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>单词小探险</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  :root{
    --bg:#FFF6EA; --card:#FFFFFF; --ink:#4A3728; --ink-soft:#9C8570;
    --orange:#FF8A3D; --orange-deep:#F0711E; --teal:#2EC4B6; --teal-deep:#23A397;
    --red:#FF6B6B; --yellow:#FFD166; --radius:24px;
  }
  html,body{ height:100%; }
  body{
    font-family:'Chalkboard SE','Comic Sans MS','PingFang SC','Microsoft YaHei',sans-serif;
    background:var(--bg); color:var(--ink);
    max-width:820px; margin:0 auto; min-height:100%;
    display:flex; flex-direction:column;
  }
  .screen{ display:none; flex:1; flex-direction:column; padding:20px 22px 110px; animation:pop .25s ease; }
  .screen.active{ display:flex; }
  @keyframes pop{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;} }

  .card{ background:var(--card); border-radius:var(--radius); padding:22px; box-shadow:0 4px 0 rgba(74,55,40,.08); }
  .big-btn{
    display:block; width:100%; border:none; cursor:pointer;
    background:var(--orange); color:#fff; font-size:23px; font-weight:bold;
    padding:18px; border-radius:20px; font-family:inherit;
    box-shadow:0 5px 0 var(--orange-deep); transition:transform .08s;
  }
  .big-btn:active{ transform:translateY(4px); box-shadow:0 1px 0 var(--orange-deep); }
  .big-btn.teal{ background:var(--teal); box-shadow:0 5px 0 var(--teal-deep); }
  .big-btn.teal:active{ box-shadow:0 1px 0 var(--teal-deep); }
  .big-btn:disabled{ opacity:.45; pointer-events:none; }
  .tag{ display:inline-block; background:#FFF0E0; color:var(--orange-deep); border-radius:999px; padding:4px 14px; font-size:14px; font-weight:bold; }
  .tag.green{ background:#E4F8F6; color:#1A8F85; }
  .topbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .topbar h1{ font-size:22px; }
  .streak{ background:#fff; border-radius:999px; padding:8px 16px; font-weight:bold; font-size:16px; box-shadow:0 3px 0 rgba(74,55,40,.08); }

  .tabbar{
    position:fixed; bottom:0; left:0; right:0; max-width:820px; margin:0 auto;
    background:#fff; display:flex; border-top:2px solid #F3E7D8; z-index:10;
    padding:8px 0 calc(8px + env(safe-area-inset-bottom));
  }
  .tab{ flex:1; text-align:center; color:var(--ink-soft); font-size:13px; cursor:pointer; padding:6px 0; }
  .tab .ico{ font-size:26px; display:block; }
  .tab.on{ color:var(--orange-deep); font-weight:bold; }

  .steps{ display:flex; gap:6px; margin-bottom:18px; }
  .steps i{ flex:1; height:8px; border-radius:99px; background:#F0E2D0; }
  .steps i.done{ background:var(--teal); }
  .steps i.now{ background:var(--yellow); }

  .week-dots{ display:flex; gap:10px; align-items:center; margin-top:12px; flex-wrap:wrap; }
  .week-dots i{
    width:32px; height:32px; border-radius:50%; background:#F0E2D0;
    display:flex; align-items:center; justify-content:center; font-size:15px; font-style:normal; font-weight:bold; color:var(--ink-soft);
  }
  .week-dots i.hit{ background:var(--yellow); color:var(--ink); }
  .week-dots span{ font-size:14px; color:var(--ink-soft); margin-left:2px; }

  .unit-card{ display:flex; align-items:center; gap:14px; margin-top:12px; cursor:pointer; border:3px solid transparent; }
  .unit-card:active{ transform:scale(.98); }
  .unit-card .u-ico{ font-size:38px; }
  .unit-card .u-body{ flex:1; }
  .unit-card .u-name{ font-size:19px; font-weight:bold; }
  .unit-card .u-sub{ font-size:13px; color:var(--ink-soft); margin-top:2px; }
  .unit-card .u-badge{ font-size:12px; font-weight:bold; border-radius:999px; padding:5px 12px; white-space:nowrap; }
  .u-badge.done{ background:#E4F8F6; color:#1A8F85; }
  .u-badge.doing{ background:#FFF0E0; color:var(--orange-deep); }
  .u-badge.new{ background:#F0E2D0; color:var(--ink-soft); }

  .word-hero{ text-align:center; padding:24px 20px 18px; }
  .word-hero .pic{ font-size:66px; }
  .word-hero .en{ font-size:44px; font-weight:bold; letter-spacing:2px; margin:8px 0 2px; }
  .word-hero .phon{ font-size:17px; color:var(--ink-soft); }
  .word-hero .syll{ font-size:20px; color:var(--teal); font-weight:bold; letter-spacing:3px; margin-top:2px; }
  .word-hero .cn{ font-size:20px; color:var(--ink-soft); margin-top:6px; }

  .scene-card{ background:#F4FBFA; border-radius:16px; padding:14px 16px; margin-top:12px; text-align:left; }
  .scene-card .sc-head{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:6px; }
  .scene-card .sc-tag{ font-size:13px; font-weight:bold; color:#1A8F85; background:#DFF7F5; border-radius:999px; padding:3px 12px; }
  .scene-card .sc-en{ font-size:19px; line-height:1.5; }
  .scene-card .sc-cn{ font-size:15px; color:var(--ink-soft); margin-top:3px; }
  .mini-speak{
    border:none; background:var(--teal); color:#fff; border-radius:50%;
    width:38px; height:38px; font-size:17px; cursor:pointer; flex-shrink:0;
    box-shadow:0 3px 0 var(--teal-deep);
  }
  .mini-speak:active{ transform:translateY(2px); box-shadow:0 1px 0 var(--teal-deep); }

  .speak-btn{
    border:none; background:var(--teal); color:#fff; font-size:18px; font-weight:bold;
    border-radius:999px; padding:10px 22px; margin-top:14px; cursor:pointer; font-family:inherit;
    box-shadow:0 4px 0 var(--teal-deep);
  }
  .speak-btn:active{ transform:translateY(3px); box-shadow:0 1px 0 var(--teal-deep); }

  .mix-banner{
    background:#FFF0E0; border-radius:14px; padding:10px 16px; font-size:14px;
    color:var(--orange-deep); font-weight:bold; margin-top:12px; text-align:center;
  }

  .spell-row{ display:flex; justify-content:center; gap:10px; margin:26px 0; flex-wrap:wrap; }
  .slot{
    width:52px; height:62px; border-radius:14px; background:#FFF0E0;
    display:flex; align-items:center; justify-content:center;
    font-size:32px; font-weight:bold; color:var(--ink);
  }
  .slot.blank{ background:#fff; border:3px dashed var(--orange); color:var(--orange-deep); }
  .slot.right{ background:#DFF7F5; border:3px solid var(--teal); color:#1A8F85; }
  .slot.wrong{ animation:shake .3s; border-color:var(--red); color:var(--red); }
  @keyframes shake{ 25%{transform:translateX(-5px);} 75%{transform:translateX(5px);} }
  .letters{ display:flex; justify-content:center; gap:12px; flex-wrap:wrap; }
  .letter-btn{
    width:58px; height:58px; border:none; border-radius:16px; cursor:pointer;
    background:#fff; font-size:28px; font-weight:bold; color:var(--ink); font-family:inherit;
    box-shadow:0 4px 0 #E4D5C3;
  }
  .letter-btn:active{ transform:translateY(3px); box-shadow:0 1px 0 #E4D5C3; }
  .letter-btn.used{ opacity:.25; pointer-events:none; }

  .dict-row{ display:flex; justify-content:center; gap:8px; margin:26px 0; flex-wrap:wrap; }
  .dict-row input{
    width:46px; height:58px; text-align:center; font-size:30px; font-weight:bold;
    border:3px solid #F0E2D0; border-radius:14px; font-family:inherit; color:var(--ink);
    background:#fff; outline:none; text-transform:lowercase;
  }
  .dict-row input:focus{ border-color:var(--orange); }
  .dict-row .spacer{ width:18px; }

  .choice{ text-align:left; margin-top:14px; cursor:pointer; border:3px solid transparent; font-size:19px; line-height:1.5; }
  .choice .em{ font-size:30px; margin-right:10px; }
  .choice.picked-right{ border-color:var(--teal); background:#F4FBFA; }
  .choice.picked-wrong{ border-color:var(--red); background:#FFF5F5; }

  .stars{ font-size:60px; text-align:center; letter-spacing:8px; margin:18px 0; }
  .stars span{ display:inline-block; animation:starpop .5s backwards; }
  .stars span:nth-child(2){ animation-delay:.2s; } .stars span:nth-child(3){ animation-delay:.4s; }
  @keyframes starpop{ from{ transform:scale(0) rotate(-40deg);} to{ transform:scale(1) rotate(0);} }

  .miss-item{ display:flex; align-items:center; justify-content:space-between; padding:14px 4px; border-bottom:2px solid #F7EDE0; }
  .miss-item:last-child{ border-bottom:none; }
  .miss-item .w{ font-size:22px; font-weight:bold; }
  .miss-item .w b{ color:var(--red); }
  .miss-item .tip{ font-size:13px; color:var(--ink-soft); margin-top:2px; }
  .pill{ background:#FFF0E0; color:var(--orange-deep); border-radius:999px; padding:5px 12px; font-size:13px; font-weight:bold; white-space:nowrap; }

  textarea{
    width:100%; min-height:100px; border:3px solid #F0E2D0; border-radius:16px;
    padding:14px; font-size:17px; font-family:inherit; color:var(--ink); background:#fff; outline:none; resize:vertical;
  }
  textarea:focus{ border-color:var(--orange); }
  .stat-grid{ display:flex; gap:12px; margin:16px 0; }
  .stat{ flex:1; background:#fff; border-radius:16px; padding:14px; text-align:center; box-shadow:0 3px 0 rgba(74,55,40,.06); }
  .stat b{ font-size:22px; color:var(--orange-deep); display:block; }
  .stat span{ font-size:12px; color:var(--ink-soft); }
  .hint{ font-size:14px; color:var(--ink-soft); line-height:1.7; margin-top:10px; }

  .unit-chips{ display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
  .chip{
    border:2px solid #F0E2D0; background:#fff; color:var(--ink); border-radius:999px;
    padding:8px 18px; font-size:15px; font-weight:bold; cursor:pointer; font-family:inherit;
  }
  .chip.on{ background:var(--orange); border-color:var(--orange); color:#fff; }
  .chip.add{ border-style:dashed; color:var(--ink-soft); }

  .word-table{ margin-top:14px; }
  .wt-row{ border:2px solid #F7EDE0; border-radius:14px; padding:12px 14px; margin-top:10px; }
  .wt-row .wt-head{ display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
  .wt-row .wt-en{ font-size:20px; font-weight:bold; }
  .wt-row .wt-phon{ font-size:14px; color:var(--ink-soft); }
  .wt-row .wt-cn{ font-size:16px; }
  .wt-row .wt-auto{ font-size:12px; color:#1A8F85; background:#DFF7F5; border-radius:99px; padding:2px 10px; font-weight:bold; }
  .wt-row .wt-manual{ font-size:12px; color:#fff; background:var(--red); border-radius:99px; padding:2px 10px; font-weight:bold; }
  .wt-row input{ border:2px solid #F0E2D0; border-radius:10px; padding:8px 10px; font-size:15px; font-family:inherit; width:100%; margin-top:8px; outline:none; }

  .saved-unit{ border-top:2px solid #F7EDE0; padding:12px 0; }
  .saved-unit b{ font-size:16px; }
  .saved-unit .words{ margin-top:6px; display:flex; flex-wrap:wrap; gap:8px; }
  .wchip{ background:#FFF6EA; border-radius:999px; padding:5px 12px; font-size:14px; display:inline-flex; align-items:center; gap:6px; }
  .wchip i{ font-style:normal; color:var(--red); cursor:pointer; font-weight:bold; }
  .goal-row{ display:flex; gap:8px; align-items:center; margin-top:10px; flex-wrap:wrap; }
  .empty-note{ text-align:center; color:var(--ink-soft); padding:30px 10px; font-size:15px; line-height:1.8; }
  .link-btn{ border:none; background:none; color:var(--ink-soft); text-decoration:underline; font-size:13px; cursor:pointer; font-family:inherit; }
</style>
</head>
<body>

<!-- ============ 首页 ============ -->
<div class="screen active" id="s-home"></div>

<!-- ============ 单元选择 ============ -->
<div class="screen" id="s-units"></div>

<!-- ============ 学习流程（动态） ============ -->
<div class="screen" id="s-play">
  <div class="steps" id="play-steps"></div>
  <div id="play-body" style="display:flex; flex-direction:column; flex:1;"></div>
</div>

<!-- ============ 自由练习场 ============ -->
<div class="screen" id="s-arena"></div>

<!-- ============ 错词本 ============ -->
<div class="screen" id="s-mistake"></div>

<!-- ============ 家长页 ============ -->
<div class="screen" id="s-parent"></div>

<div class="tabbar">
  <div class="tab on" data-t="s-home" onclick="tab(this)"><span class="ico">🏠</span>学习</div>
  <div class="tab" data-t="s-mistake" onclick="tab(this)"><span class="ico">📕</span>错词本</div>
  <div class="tab" data-t="s-parent" onclick="tab(this)"><span class="ico">👨‍👩‍👧</span>家长录词</div>
</div>

<script>
/* =====================================================================
   内置词典：人教版PEP三年级核心词（约110个）
   格式：word: [音标, 音节拆分, 中文, emoji, [[场景标签, 英文例句, 中文], ...]]
===================================================================== */
const DICT = {};
function D(w,p,s,c,e,sc){ DICT[w] = {p,s,c,e,sc}; }

/* —— 文具 —— */
D('pen','/pen/','pen','钢笔','🖊️',[['✏️ 借东西时','May I use your pen?','我能用一下你的钢笔吗？'],['🎒 收拾书包','Put the pen in your bag.','把钢笔放进书包。']]);
D('pencil','/ˈpensl/','pen·cil','铅笔','✏️',[['🎨 画画前','I draw with a pencil.','我用铅笔画画。'],['🏫 上课时','Take out your pencil, please.','请拿出你的铅笔。']]);
D('ruler','/ˈruːlə/','ru·ler','尺子','📏',[['📐 画直线时','I use a ruler to draw a line.','我用尺子画直线。'],['🙋 借东西时','Can I borrow your ruler?','能借我你的尺子吗？']]);
D('eraser','/ɪˈreɪzə/','e·ra·ser','橡皮','🧽',[['✏️ 写错字时','I need an eraser.','我需要一块橡皮。'],['🙋 借东西时','Lend me your eraser, please.','请借我一下橡皮。']]);
D('crayon','/ˈkreɪən/','cray·on','蜡笔','🖍️',[['🎨 画画时','I colour the sun with a yellow crayon.','我用黄蜡笔画太阳。'],['🖍️ 说数量','I have twelve crayons.','我有十二支蜡笔。']]);
D('bag','/bæɡ/','bag','书包','🎒',[['🎒 上学前','My bag is heavy today.','我今天的书包很重。'],['🧹 收拾时','Put your books in the bag.','把书放进书包。']]);
D('book','/bʊk/','book','书','📖',[['📖 上课','Open your books, please.','请打开书。'],['🌙 睡前','I read a book before bed.','我睡前读一本书。']]);
D('pencil box','/ˈpensl bɒks/','pen·cil box','铅笔盒','📦',[['✏️ 收拾文具','Put the pen in the pencil box.','把钢笔放进铅笔盒。'],['🎒 上学前','Is your pencil box in your bag?','铅笔盒放进书包了吗？']]);

/* —— 颜色 —— */
D('red','/red/','red','红色','🔴',[['🍎 说颜色','The apple is red.','苹果是红色的。'],['🚦 过马路','Stop! The light is red.','停！现在是红灯。']]);
D('yellow','/ˈjeləʊ/','yel·low','黄色','🟡',[['🍌 说颜色','The banana is yellow.','香蕉是黄色的。'],['🌻 看花','I like the yellow flower.','我喜欢那朵黄色的花。']]);
D('blue','/bluː/','blue','蓝色','🔵',[['🌤️ 看天空','The sky is blue.','天空是蓝色的。'],['🎒 说东西','My bag is blue.','我的书包是蓝色的。']]);
D('green','/ɡriːn/','green','绿色','🟢',[['🌿 看树叶','The leaves are green.','树叶是绿色的。'],['🚦 过马路','Go! The light is green.','走！绿灯亮了。']]);
D('black','/blæk/','black','黑色','⚫',[['🐱 说动物','The cat is black.','这只猫是黑色的。'],['🎨 画画','Colour it black.','把它涂成黑色。']]);
D('white','/waɪt/','white','白色','⚪',[['🐰 说动物','The rabbit is white.','兔子是白色的。'],['☁️ 看云','The clouds are white.','云是白色的。']]);
D('orange','/ˈɒrɪndʒ/','or·ange','橙色；橙子','🟠',[['🍊 说颜色','The orange is orange!','橙子是橙色的！'],['🎨 画画','I like orange crayons.','我喜欢橙色的蜡笔。']]);
D('brown','/braʊn/','brown','棕色','🟤',[['🐻 说动物','The bear is brown.','熊是棕色的。'],['👟 说鞋子','My shoes are brown.','我的鞋子是棕色的。']]);

/* —— 身体 —— */
D('face','/feɪs/','face','脸','😊',[['🧼 早上起床','I wash my face every morning.','我每天早上洗脸。'],['😊 说表情','She has a happy face.','她满脸笑容。']]);
D('ear','/ɪə/','ear','耳朵','👂',[['👂 听声音','I hear with my ears.','我用耳朵听声音。'],['🐰 说动物','The rabbit has long ears.','兔子的耳朵长长的。']]);
D('eye','/aɪ/','eye','眼睛','👁️',[['👀 看东西','I see with my eyes.','我用眼睛看东西。'],['✨ 说长相','Her eyes are big and bright.','她的眼睛又大又亮。']]);
D('nose','/nəʊz/','nose','鼻子','👃',[['🌸 闻花香','I smell flowers with my nose.','我用鼻子闻花香。'],['🤧 感冒时','My nose is running.','我流鼻涕了。']]);
D('mouth','/maʊθ/','mouth','嘴巴','👄',[['🍚 吃饭时','Open your mouth, please.','请张开嘴。'],['🪥 刷牙','Brush your teeth and clean your mouth.','刷牙，把小嘴刷干净。']]);
D('arm','/ɑːm/','arm','手臂','💪',[['👋 打招呼','Wave your arm and say hello.','挥挥手臂打个招呼。'],['🏃 做运动','My arms are strong.','我的手臂很有力。']]);
D('hand','/hænd/','hand','手','✋',[['🙋 上课提问','Put up your hand.','请举手。'],['🧼 饭前','Wash your hands before dinner.','饭前要洗手。']]);
D('head','/hed/','head','头','🎩',[['🎩 说穿戴','The hat is on my head.','帽子戴在我头上。'],['🤕 磕碰时','I bumped my head.','我撞到脑袋了。']]);
D('body','/ˈbɒdi/','bod·y','身体','🤸',[['🛀 洗澡时','Wash your body well.','洗澡要洗干净。'],['🏃 说健康','Exercise is good for your body.','运动对身体好。']]);
D('leg','/leɡ/','leg','腿','🦵',[['🏃 跑步','My legs run fast.','我的腿跑得很快。'],['🐸 说动物','The frog has strong legs.','青蛙的腿很有力。']]);
D('foot','/fʊt/','foot','脚','🦶',[['⚽ 踢球','I kick the ball with my foot.','我用脚踢球。'],['👣 说长大','My feet are growing.','我的脚在长大。']]);

/* —— 动物 —— */
D('duck','/dʌk/','duck','鸭子','🦆',[['🏞️ 去公园','The duck swims in the lake.','鸭子在湖里游泳。'],['🎵 唱儿歌','Five little ducks went out one day.','五只小鸭子出门了。']]);
D('pig','/pɪɡ/','pig','猪','🐷',[['🚜 农场里','The pig is fat and pink.','这只猪又胖又粉。'],['📖 读故事','The three little pigs built houses.','三只小猪盖房子。']]);
D('cat','/kæt/','cat','猫','🐱',[['🐱 说宠物','My cat sleeps all day.','我的猫整天睡觉。'],['🐭 看动画','The cat runs after the mouse.','猫追着老鼠跑。']]);
D('bear','/beə/','bear','熊','🐻',[['🧸 说玩具','I sleep with my teddy bear.','我抱着泰迪熊睡觉。'],['🍯 森林里的','The bear likes honey.','熊喜欢蜂蜜。']]);
D('dog','/dɒɡ/','dog','狗','🐶',[['🐶 说宠物','My dog can catch a ball.','我的狗会接球。'],['🚶 晚饭后','I walk my dog after dinner.','晚饭后我遛狗。']]);

function todayStr(){ const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function addDays(ds, n){ const d = new Date(ds+'T12:00:00'); d.setDate(d.getDate()+n); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function weekStartStr(){ const d = new Date(); const dow = (d.getDay()+6)%7; d.setDate(d.getDate()-dow); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function shuffle(a){ return [...a].sort(()=>Math.random()-.5); }

function wp(w){ return S.wp[w]; }
function wpEnsure(w){ if(!S.wp[w]) S.wp[w] = {lv:0, next:todayStr(), streak:0, fails:0, miss:{}, seen:false, last:''}; return S.wp[w]; }

function dictLookup(w){ // 大小写不敏感查找
  if(DICT[w]) return w;
  const lw = w.toLowerCase();
  return Object.keys(DICT).find(k=>k.toLowerCase()===lw) || null;
}
function info(w){
  const key = dictLookup(w);
  const d = key ? DICT[key] : null;
  if(d) return d;
  const c = S.custom[w] || {};
  return { p:c.p||'', s:c.s||w.split(' ').join('·'), c:c.c||'（待补充）', e:'🔤',
    sc:[['🗣️ 认识它', 'My new word is ' + w + '.', '我的新单词是 ' + w + '。']] };
}
function allUnitWords(){ return S.units.flatMap(u=>u.words); }

   首页
===================================================================== */
function weekCheckins(){ const ws = weekStartStr(); return S.checkins.filter(d=>d>=ws).length; }
function currentStreak(){
  let n = 0; let d = todayStr();
  if(!S.checkins.includes(d)) d = addDays(d,-1);
  while(S.checkins.includes(d)){ n++; d = addDays(d,-1); }
  return n;
}
function mistakeWords(){
  return allUnitWords().filter(w=>{ const p = wp(w); return p && p.fails>0 && p.streak<3; });
}
function planToday(){
  const today = todayStr();
  const seen = allUnitWords().filter(w=>wp(w) && wp(w).seen);
  const due = seen.filter(w=>wp(w).next <= today)
    .sort((a,b)=>(wp(a).next<wp(b).next?-1:1) || (wp(b).fails-wp(a).fails));
  const news = [];
  for(const u of S.units){
    for(const w of u.words){
      if(!news.includes(w) && (!wp(w) || !wp(w).seen)) news.push(w);
    }
    if(news.length>=3) break;
  }
  const reviews = due.slice(0,5).map(w=>({w, type:'review'}));
  const newOnes = news.slice(0,3).map(w=>({w, type:'new'}));
  return [...reviews, ...newOnes];
}

function renderHome(){
  const el = document.getElementById('s-home');
  const doneToday = S.checkins.includes(todayStr());
  const plan = planToday();
  const mistakes = mistakeWords();
  const goal = S.settings.weekly, hits = weekCheckins();
  const h = new Date().getHours();
  const greet = h<11 ? '早上好' : h<14 ? '中午好' : h<18 ? '下午好' : '晚上好';

  let dots = '';
  for(let i=0;i<goal;i++) dots += `<i class="${i<hits?'hit':''}">${i<hits?'⭐':i+1}</i>`;

  el.innerHTML = `
    <div class="topbar">
      <h1>🌞 ${greet}，小朋友！</h1>
      <div class="streak">🔥 连续 ${currentStreak()} 天</div>
    </div>

    ${doneToday ? `
    <div class="card" style="text-align:center; padding:26px 22px;">
      <div style="font-size:52px;">🎉</div>
      <p style="font-size:19px; line-height:1.8; margin-top:8px;">今天的打卡已完成，真棒！<br>
      <span style="color:var(--ink-soft); font-size:15px;">想多练一会儿？可以自己去选单元哦</span></p>
      <button class="big-btn teal" style="margin-top:16px;" onclick="go('s-units')">📚 加练一个单元</button>
    </div>` : `
    <div class="card" style="text-align:center; padding:26px 22px;">
      <div class="tag">今日任务 · 约 8 分钟</div>
      <div style="font-size:46px; margin:12px 0 4px;">${plan.length ? plan.slice(0,4).map(it=>info(it.w).e).join('') : '🎉'}</div>

/* =====================================================================
   学习流程引擎
===================================================================== */
let SES = null; // {items, steps, idx, start, results:{word:{pass, missIdx:[]}}}

function buildSession(items, label, free){
  // 第一段：学 —— 所有新词卡片连续过完（只看不考）
  const cards = items.filter(it=>it.type==='new').map(it=>({kind:'card', w:it.w, phase:'学一学'}));
  // 第二段：练 —— 全部词打乱混在一起考，考的时候已经隔了几个词
  const practice = items.map(it=> it.type==='new'
    ? {kind:'missing', w:it.w, hard:false, phase:'练一练'}
    : {kind:'dictation', w:it.w, phase:'练一练'});
  const quizWords = shuffle(items.filter(it=>DICT[it.w])).slice(0,2);
  quizWords.forEach(it=>practice.push({kind:'quiz', w:it.w, phase:'练一练'}));
  const steps = [...cards, ...shuffle(practice)];
  SES = { steps, idx:0, start:Date.now(), results:{}, label, free:!!free, retried:false };
  steps.forEach(st=>{ if(!SES.results[st.w]) SES.results[st.w] = {pass:true, missIdx:[]}; });
}
function startToday(){
  const plan = planToday();
  if(!plan.length) return;
  buildSession(plan, '今日任务');
  go('s-play'); renderStep();
}
function startUnit(unitId){
  const idx = S.units.findIndex(u=>u.id===unitId);
  if(idx<0) return;
  const u = S.units[idx];
  const main = shuffle(u.words).slice(0,8).map(w=>({w, type:(wp(w)&&wp(w).seen)?'review':'new'}));
  // 混入前面单元的旧词（30%），错词本优先
  let mix = [];
  if(idx>0){
    const earlier = S.units.slice(0,idx).flatMap(x=>x.words).filter(w=>wp(w)&&wp(w).seen);
    earlier.sort((a,b)=>{ const pa=wp(a),pb=wp(b); return (pa.streak-pb.streak) || (pb.fails-pa.fails); });
    const n = Math.max(1, Math.round(main.length*0.3));
    mix = earlier.slice(0,n).map(w=>({w, type:'review'}));
  }
  const items = shuffle([...main, ...mix]).slice(0,9);
  buildSession(items, u.name + (mix.length?`（混入 ${mix.length} 个复习词）`:''));
  go('s-play'); renderStep();
}

function renderStepsBar(){
  const bar = document.getElementById('play-steps');
  bar.innerHTML = SES.steps.map((_,i)=>{
    const cls = i<SES.idx ? 'done' : i===SES.idx ? 'now' : '';
    return `<i class="${cls}"></i>`;
  }).join('');
}

function renderStep(){
  renderStepsBar();
  const st = SES.steps[SES.idx];
  const body = document.getElementById('play-body');
  if(!st){ finishSession(); return; }
  if(st.kind==='card') renderCard(body, st);
  else if(st.kind==='missing') renderMissing(body, st);
  else if(st.kind==='dictation') renderDictation(body, st);
  else if(st.kind==='quiz') renderQuiz(body, st);
}
function nextStep(){
  SES.idx++;
  // 第三段：回炉 —— 练完一轮后，错的词当场再来一次（不影响成绩记录，只纠正）
  if(SES.idx >= SES.steps.length && !SES.retried && !SES.free){
    const failed = Object.keys(SES.results).filter(w=>!SES.results[w].pass);
    if(failed.length){
      SES.retried = true;
      failed.forEach(w=>{
        const orig = SES.steps.find(s=>s.w===w && (s.kind==='missing'||s.kind==='dictation'));
        SES.steps.push({kind:(orig&&orig.kind)||'missing', w, hard:false, retry:true, phase:'回炉重练'});
      });
    }
  }
  renderStep();
}

/* —— 步骤1：认识单词 —— */

/* —— 步骤2：缺字母 —— */
function renderMissing(body, st){
  const chars = st.w.split('');                       // 保留空格和标点
  const isLetter = c=>/[a-zA-Z]/.test(c);
  const letterIdx = chars.map((c,i)=>isLetter(c)?i:-1).filter(i=>i>=0);
  const p = wp(st.w);
  // 空格数：新词1-2个，复习2-3个；优先挖她错过的位置，首字母保留做提示
  let n = st.hard ? Math.min(3, Math.max(2, Math.round(letterIdx.length/2)))
                  : Math.min(2, Math.max(1, Math.round(letterIdx.length/3)));
  n = Math.min(n, Math.max(0, letterIdx.length-2));
  if(n < 1){ nextStep(); return; }
  const missedIdx = Object.keys((p&&p.miss)||{}).map(Number)
    .filter(i=>letterIdx.includes(i) && i!==letterIdx[0]).sort((a,b)=>p.miss[b]-p.miss[a]);
  const candidates = letterIdx.filter(i=>i!==letterIdx[0]);
  let blanks = missedIdx.slice(0,n);
  for(const i of shuffle(candidates)){ if(blanks.length>=n) break; if(!blanks.includes(i)) blanks.push(i); }
  blanks.sort((a,b)=>a-b);

  body.innerHTML = `
    <span class="tag">${SES.label||''} · ${st.retry?'🔄 回炉重练':(st.phase||'练一练')+' · 拼一拼'}</span>
    <div class="card" style="margin-top:12px; text-align:center;">
      <div style="font-size:44px;">${info(st.w).e}</div>
      <div class="hint" style="margin:2px 0 0;">${info(st.w).c} · ${info(st.w).s}</div>
      <div class="spell-row" id="slots"></div>
      <div class="letters" id="pool"></div>
      <button class="speak-btn" id="spk">🔊 听发音</button>
    </div>`;
  document.getElementById('spk').onclick = ()=>speak(st.w);

  const slots = document.getElementById('slots');
  chars.forEach((ch,i)=>{
    if(ch===' '){ const sp=document.createElement('div'); sp.style.width='14px'; slots.appendChild(sp); return; }
    if(!isLetter(ch)){
      const fx=document.createElement('div');
      fx.style.cssText='display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:bold;min-width:14px;';
      fx.textContent=ch; slots.appendChild(fx); return;
    }
    const d = document.createElement('div');
    if(blanks.includes(i)){ d.className='slot blank'; d.dataset.need=ch; d.dataset.idx=i; d.textContent='?'; }
    else { d.className='slot'; d.textContent=ch; }
    slots.appendChild(d);
  });

  // 缺几个字母就给几个正确按钮 + 2个干扰
  const needed = blanks.map(i=>chars[i]);
  const distract = shuffle('abcdefghijklmnopqrstuvwxyz'.split('').filter(c=>!needed.map(x=>x.toLowerCase()).includes(c))).slice(0,2);
  const pool = document.getElementById('pool');
  shuffle([...needed, ...distract]).forEach(ch=>{
    const b = document.createElement('button');
    b.className='letter-btn'; b.textContent=ch;
    b.onclick = ()=>{
      const blank = document.querySelector('.slot.blank');
      if(!blank) return;
      if(ch === blank.dataset.need){
        blank.textContent = ch; blank.classList.remove('blank'); blank.classList.add('right');
        b.classList.add('used');
        if(!document.querySelector('.slot.blank')){
          speak(st.w);
          setTimeout(nextStep, 800);
        }
      } else {
        blank.classList.add('wrong');
        setTimeout(()=>blank.classList.remove('wrong'), 350);
        if(!st.retry){
          const r = SES.results[st.w];
          r.pass = false;
          const ix = Number(blank.dataset.idx);
          if(!r.missIdx.includes(ix)) r.missIdx.push(ix);
        }
      }
    };
    pool.appendChild(b);
  });
}

/* —— 步骤3：听音默写 —— */
function renderDictation(body, st){
  const word = st.w;
  const letters = word.split('');
  const d = info(word);
  body.innerHTML = `
    <span class="tag">${SES.label||''} · ${st.retry?'🔄 回炉重练':(st.phase||'练一练')+' · 听音默写'}</span>
    <div class="card" style="margin-top:12px; text-align:center;">
      <div class="hint" style="margin-top:0;">听到什么写什么，写完点「检查」</div>
      <button class="speak-btn" style="font-size:22px; padding:14px 30px;" id="spk">🔊 播放单词</button>
      <div class="dict-row" id="inputs"></div>
      <div class="hint" id="dict-hint" style="display:none;">💡 提示：${d.c} · 可以分成 ${d.s}</div>
      <button class="link-btn" id="hint-btn" style="margin-bottom:6px;">实在不会？点我要提示</button>
      <button class="big-btn" style="margin-top:10px;" id="check">检查 ✔</button>
    </div>`;
  speak(word);
  document.getElementById('spk').onclick = ()=>speak(word);

  const row = document.getElementById('inputs');
  letters.forEach((ch,i)=>{
    if(ch===' '){ const sp = document.createElement('div'); sp.className='spacer'; row.appendChild(sp); return; }
    if(!/[a-zA-Z]/.test(ch)){ // 标点直接固定显示，不需要默写
      const fx = document.createElement('div');
      fx.style.cssText='display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:bold;min-width:16px;';
      fx.textContent = ch; row.appendChild(fx); return;
    }
    const inp = document.createElement('input');
    inp.maxLength = 1; inp.dataset.ch = ch; inp.dataset.i = i;
    inp.setAttribute('autocapitalize','off'); inp.setAttribute('autocomplete','off');
    inp.oninput = ()=>{ const nx = [...row.querySelectorAll('input')]; const k = nx.indexOf(inp); if(inp.value && nx[k+1]) nx[k+1].focus(); };
    row.appendChild(inp);
  });

  let tried = false;
  document.getElementById('hint-btn').onclick = ()=>{ document.getElementById('dict-hint').style.display='block'; };
  document.getElementById('check').onclick = ()=>{
    const inputs = [...row.querySelectorAll('input')];
    let allRight = true;
    inputs.forEach(inp=>{
      const ok = inp.value.toLowerCase() === inp.dataset.ch.toLowerCase();
      inp.style.borderColor = ok ? 'var(--teal)' : 'var(--red)';
      if(!ok && !st.retry){
        const r = SES.results[st.w];
        const ix = Number(inp.dataset.i);
        if(!r.missIdx.includes(ix)) r.missIdx.push(ix);
      }
      if(!ok) allRight = false;
    });
    if(allRight){
      if(tried && !st.retry) SES.results[st.w].pass = false; // 第一次没全对也算没一次通过
      speak(word);
      setTimeout(nextStep, 700);
    } else {
      tried = true;
      if(!st.retry) SES.results[st.w].pass = false;
      document.getElementById('dict-hint').style.display = 'block'; // 错了才给提示
    }
  };
}

/* —— 步骤4：场景选择题（3个选项，均可听；选对后播完整句再跳转） —— */
function speakCb(text, cb){
  try{
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US'; u.rate = 0.8;
    let done = false;
    const fin = ()=>{ if(!done){ done = true; cb && cb(); } };
    u.onend = fin;
    setTimeout(fin, 8000); // 兜底，防止onend不触发卡死
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  }catch(e){ cb && cb(); }
}
function renderQuiz(body, st){
  const d = info(st.w);
  const correct = d.sc[Math.floor(Math.random()*d.sc.length)];
  // 干扰项：从别的词的例句里抽2个
  const others = shuffle(Object.keys(DICT).filter(w=>w!==st.w && DICT[w].sc.length)).slice(0,2);
  if(!others.length){ nextStep(); return; }
  const options = shuffle([
    {s:correct, ok:true, w:st.w},
    ...others.map(w=>({s:DICT[w].sc[Math.floor(Math.random()*DICT[w].sc.length)], ok:false, w}))
  ]);

  body.innerHTML = `
    <span class="tag">${SES.label||''} · ${st.phase||'练一练'} · 想一想</span>
    <div class="card" style="margin-top:12px; text-align:center;">
      <div style="font-size:20px;">哪个场景用 <b style="color:var(--orange-deep); font-size:24px;">${st.w}</b>（${d.c}）？</div>
      <div class="hint" style="margin-top:4px;">可以先点 🔊 听一听每个句子，再选</div>
    </div>
    <div id="opts"></div>`;
  const box = document.getElementById('opts');
  options.forEach(op=>{
    const div = document.createElement('div');
    div.className = 'card choice';
    div.style.display = 'flex'; div.style.alignItems = 'center'; div.style.gap = '12px';
    div.innerHTML = `
      <div style="flex:1;"><span class="em">${info(op.w).e}</span>${op.s[2]}<br><small style="color:var(--ink-soft)">${op.s[1]}</small></div>
      <button class="mini-speak">🔊</button>`;
    div.querySelector('.mini-speak').onclick = (e)=>{ e.stopPropagation(); speak(op.s[1]); };
    div.onclick = ()=>{
      if(op.ok){
        [...box.children].forEach(c=>c.style.pointerEvents='none');
        div.classList.add('picked-right');
        speakCb(op.s[1], nextStep);   // 播完整句再进下一题
      } else {
        div.classList.add('picked-wrong');
        setTimeout(()=>div.classList.remove('picked-wrong'), 900);
      }
    };
    box.appendChild(div);
  });
}

/* —— 结算 —— */
function finishSession(){
  const secs = Math.round((Date.now()-SES.start)/1000);
  const words = Object.keys(SES.results);
  let okCount = 0;
  const today = todayStr();
  words.forEach(w=>{
    const p = wpEnsure(w);
    const r = SES.results[w];
    p.seen = true; p.last = today;
    r.missIdx.forEach(ix=>{ p.miss[ix] = (p.miss[ix]||0)+1; });
    if(r.pass){
      okCount++;
      p.streak++;
      p.lv = Math.min(5, p.lv+1);
      p.next = addDays(today, IV[p.lv]);
    } else {
      p.fails++;
      p.streak = 0;
      p.lv = Math.max(0, p.lv-1);
      p.next = addDays(today, 1);
    }
  });
  const acc = words.length ? okCount/words.length : 1;
  const earned = acc>=0.9 ? 3 : acc>=0.7 ? 2 : 1;
  S.stars += earned;
  if(!SES.free && !S.checkins.includes(today)) S.checkins.push(today); // 自由练习不算打卡
  S.log.push({d:today, secs, total:words.length, ok:okCount});
  save();

  const graduated = words.filter(w=>{ const p=wp(w); return p.fails>0 && p.streak>=3; });
  const mm = Math.floor(secs/60), ss = secs%60;
  document.getElementById('play-body').innerHTML = `
    <div class="card" style="text-align:center; padding:36px 22px; margin-top:10px;">
      <div style="font-size:26px; font-weight:bold;">${SES.free ? '自由练习完成！' : '任务完成啦！'}</div>
      <div class="stars">${'<span>⭐</span>'.repeat(earned)}</div>
      <p style="font-size:17px; color:var(--ink-soft); line-height:1.9;">
        用时 ${mm?mm+' 分 ':''}${ss} 秒 · 共 ${words.length} 个词 · 一次通过 ${okCount} 个<br>
        ${SES.retried ? '错了的词已经当场回炉重练过 💪<br>' : ''}
        ${graduated.length?`<b style="color:var(--orange-deep)">${graduated.join('、')} 从错词本毕业啦 🎓</b><br>`:''}
        ${SES.free ? '本次是自由练习，不计打卡' : `本周打卡 ${weekCheckins()} / ${S.settings.weekly} 次`}
      </p>
      <button class="big-btn" style="margin-top:22px;" onclick="goHome()">收下星星，明天见 🌙</button>
    </div>`;
  document.getElementById('play-steps').innerHTML = SES.steps.map(()=>'<i class="done"></i>').join('');
}
function goHome(){ renderAll(); go('s-home'); }

    c.className = 'chip' + (arenaScope===id?' on':'');
    c.textContent = name;
    c.onclick = ()=>{ arenaScope=id; renderArena(); };
    sbox.appendChild(c);
  });
  document.getElementById('arena-go').onclick = startArena;
}
function startArena(){
  let pool;
  if(arenaScope==='mistakes'){
    pool = mistakeWords().sort((a,b)=>wp(b).fails-wp(a).fails);
  } else {
    const u = S.units.find(x=>x.id===arenaScope);
    pool = u ? shuffle(u.words) : [];
  }
  if(arenaMode==='quiz') pool = pool.filter(w=>dictLookup(w)); // 场景题需要词库例句
  pool = pool.slice(0,6);
  if(!pool.length){
    alert(arenaScope==='mistakes'
      ? '错词本是空的，太棒了！换个单元练吧'
      : (arenaMode==='quiz' ? '这个单元没有词库例句，换个玩法吧' : '这个范围暂时没有可练的词'));
    return;
  }
  const steps = pool.map(w=>({kind:arenaMode, w, hard:!!(wp(w)&&wp(w).seen), phase:'自由练习'}));
  SES = { steps, idx:0, start:Date.now(), results:{}, label:'🎯 自由练习', free:true, retried:true };
  steps.forEach(st=>{ SES.results[st.w] = {pass:true, missIdx:[]}; });
  go('s-play'); renderStep();
}

/* =====================================================================
   错词本
===================================================================== */
function renderMistake(){
  const el = document.getElementById('s-mistake');
  const list = mistakeWords().sort((a,b)=>(wp(b).fails-wp(a).fails));
  const unitOf = w => (S.units.find(u=>u.words.includes(w))||{}).name || '';
  el.innerHTML = `
    <div class="topbar"><h1>📕 错词本</h1><span class="tag">${list.length ? '消灭它们！' : '太棒了'}</span></div>
    ${list.length===0 ? '<div class="card empty-note">🎉 错词本是空的！<br>继续保持哦</div>' : `
    <div class="card">
      ${list.map(w=>{
        const p = wp(w);
        // 标红最常错的字母
        const missTop = Object.entries(p.miss).sort((a,b)=>b[1]-a[1]).map(x=>Number(x[0]));
        const shown = w.split('').map((ch,i)=> missTop.slice(0,1).includes(i) ? `<b>${ch}</b>` : ch).join('');
        return `<div class="miss-item">
          <div>
            <div class="w">${shown} <span style="font-size:12px; color:var(--ink-soft); font-weight:normal;">${unitOf(w)}</span></div>
            <div class="tip">${info(w).c} · 已连续拼对 ${p.streak} / 3 次</div>
          </div>
          <span class="pill">${p.next<=todayStr()?'今天复习':p.next}</span>
        </div>`;
      }).join('')}
    </div>
    <div class="hint" style="padding:0 6px;">规则：一个词连续拼对 3 次，就从错词本"毕业"🎓</div>`}`;
}

/* =====================================================================
   家长页
===================================================================== */
let curUnitId = null;
function renderParent(){
  const el = document.getElementById('s-parent');
  if(!curUnitId || !S.units.find(u=>u.id===curUnitId)) curUnitId = S.units[0] ? S.units[0].id : null;

  // 统计
  const today = todayStr(), ws = weekStartStr();
  const todayLog = S.log.filter(l=>l.d===today);
  const todaySecs = todayLog.reduce((a,b)=>a+b.secs,0);
  const weekLog = S.log.filter(l=>l.d>=ws);
  const weekAcc = weekLog.length ? Math.round(100*weekLog.reduce((a,b)=>a+b.ok/b.total,0)/weekLog.length) : null;

  // 易错字母统计
  const letterCount = {};
  Object.entries(S.wp).forEach(([w,p])=>{
    Object.entries(p.miss||{}).forEach(([ix,n])=>{
      const ch = (w.replace(/ /g,'')[ix]||'').toLowerCase();
      if(ch) letterCount[ch] = (letterCount[ch]||0)+n;
    });
  });
  const topLetters = Object.entries(letterCount).sort((a,b)=>b[1]-a[1]).slice(0,4);

  el.innerHTML = `
    <div class="topbar"><h1>👨‍👩‍👧 家长小助手</h1></div>

    <div class="stat-grid">
      <div class="stat"><b>${todaySecs? Math.floor(todaySecs/60)+"'"+(todaySecs%60)+'"' : '—'}</b><span>今日用时</span></div>
      <div class="stat"><b>${weekCheckins()}/${S.settings.weekly}</b><span>本周打卡</span></div>
      <div class="stat"><b>${weekAcc===null?'—':weekAcc+'%'}</b><span>本周一次通过率</span></div>
    </div>

    <div class="card">
      <b>📝 按单元录入单词</b>
      <div class="hint">① 选单元（没有就点「➕ 新单元」）→ ② 粘贴英文，每行一个 → ③ 自动生成词卡。<b style="color:#1A8F85">音标、中文、场景例句自动补好</b>（内置小学核心词库 ${Object.keys(DICT).length} 词，教材常见词全覆盖）。</div>
      <div class="unit-chips" id="unit-chips"></div>
      <textarea id="wordInput" style="margin-top:12px;" placeholder="只输英文，每行一个，例如：&#10;banana&#10;strawberry&#10;watermelon"></textarea>
      <button class="big-btn" style="margin-top:12px; font-size:18px;" id="autofill-btn">✨ 自动生成词卡并存入单元</button>
      <div class="word-table" id="wordTable"></div>
    </div>

    <div class="card" style="margin-top:16px;">
      <b>🗂️ 已录入的单元</b>
      <div id="saved-units"></div>
    </div>

    <div class="card" style="margin-top:16px;">
      <b>📊 她的薄弱点（自动统计）</b>
      ${topLetters.length ? `<div class="hint" style="margin-top:8px;">最常写错的字母：${topLetters.map(([c,n])=>`<b style="color:var(--red)">${c}</b>（${n}次）`).join('、')}<br>建议：错词本里的词多听写几轮，拼的时候按音节分块记。</div>`
        : '<div class="hint" style="margin-top:8px;">还没有错题数据，练几天后来看看。</div>'}
    </div>

    <div class="card" style="margin-top:16px;">
      <b>⚙️ 设置</b>
      <div class="goal-row">
        <span style="font-size:15px;">每周打卡目标：</span>
        ${[3,4,5,6,7].map(n=>`<button class="chip ${S.settings.weekly===n?'on':''}" onclick="setWeekly(${n})">${n} 次</button>`).join('')}
      </div>
      <div style="margin-top:18px; border-top:2px solid #F7EDE0; padding-top:14px;">
        <b style="font-size:15px;">💾 学习数据备份</b>
        <div class="hint" style="margin-top:4px;">数据只存在这台 iPad 上。建议<b>每周点一次「导出备份码」</b>，复制发到微信收藏；换设备或数据丢了，粘贴回来点「导入」即可恢复。</div>
        <div class="goal-row">
          <button class="chip" onclick="exportData()">📤 导出备份码</button>
          <button class="chip" onclick="importData()">📥 导入备份码</button>
        </div>
        <textarea id="backup-box" style="display:none; margin-top:10px; min-height:70px; font-size:13px;" placeholder="导出的备份码会出现在这里；导入时把备份码粘贴到这里"></textarea>
      </div>
      <div style="margin-top:12px; text-align:right;">
        <button class="link-btn" onclick="resetAll()">🗑️ 清空全部数据（慎用）</button>
      </div>
    </div>`;

  renderUnitChips();
  renderSavedUnits();
  document.getElementById('autofill-btn').onclick = autoFill;
}

function setWeekly(n){ S.settings.weekly = n; save(); renderParent(); }

/* 备份 / 恢复 */
function exportData(){
  const box = document.getElementById('backup-box');
  box.style.display = 'block'; box.readOnly = true;
  box.value = 'WQ2:' + btoa(unescape(encodeURIComponent(JSON.stringify(S))));
  box.select();
  const done = ()=>alert('备份码已生成并尝试复制 ✅\n\n如果已复制：去微信发给"文件传输助手"或收藏，写上周几。\n如果没复制成功：长按文本框 → 全选 → 拷贝。');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(box.value).then(done, ()=>{ try{ document.execCommand('copy'); }catch(e){} done(); });
  } else {
    try{ document.execCommand('copy'); }catch(e){}
    done();
  }
}
function importData(){
  const box = document.getElementById('backup-box');
  box.style.display = 'block';
  const raw = (box.value||'').trim();
  if(!raw){ box.readOnly = false; box.focus(); alert('请先把备份码粘贴到下面的文本框，再点一次「导入备份码」'); return; }
  try{
    const json = raw.startsWith('WQ2:') ? decodeURIComponent(escape(atob(raw.slice(4)))) : raw;
    const data = JSON.parse(json);
    if(!data || !Array.isArray(data.units) || !data.settings) throw new Error('bad');
    if(!confirm('导入会覆盖当前所有学习数据，确定吗？')) return;
    S = data; save(); renderAll(); go('s-home');
    alert('✅ 恢复成功！单词、打卡、错词本都回来了');
  }catch(e){
    alert('备份码不对，请检查是否完整复制（很长一串，别漏头尾）');
  }
}
function resetAll(){
  if(confirm('确定清空吗？会删掉所有单元、进度和打卡记录！')){
    if(confirm('再确认一次：真的全部清空？')){
      localStorage.removeItem(LS_KEY);
      S = load(); save();
      renderAll(); go('s-home');
    }
  }
}

function renderUnitChips(){
  const box = document.getElementById('unit-chips');
  if(!box) return;
  box.innerHTML = '';
  S.units.forEach(u=>{
    const c = document.createElement('button');
    c.className = 'chip' + (u.id===curUnitId ? ' on' : '');
    c.textContent = u.name;
    c.onclick = ()=>{ curUnitId = u.id; renderUnitChips(); };
    box.appendChild(c);
  });
  const add = document.createElement('button');
  add.className = 'chip add';
  add.textContent = '➕ 新单元';
  add.onclick = ()=>{
    const name = prompt('新单元叫什么？例如「Unit 4 · 食物」');
    if(name && name.trim()){
      const u = {id:uid(), name:name.trim(), words:[]};
      S.units.push(u); curUnitId = u.id; save();
      renderParent();
    }
  };
  box.appendChild(add);
}

function renderSavedUnits(){
  const box = document.getElementById('saved-units');
  if(!box) return;
  box.innerHTML = S.units.length ? '' : '<div class="hint">还没有单元</div>';
  S.units.forEach(u=>{
    const div = document.createElement('div');
    div.className = 'saved-unit';
    div.innerHTML = `<b>${u.name}</b> <span style="font-size:13px; color:var(--ink-soft);">（${u.words.length} 个词）</span>
      <button class="link-btn" style="float:right;" data-del-unit="${u.id}">删除单元</button>
      <div class="words"></div>`;
    const wbox = div.querySelector('.words');
    wbox.innerHTML = u.words.length
      ? u.words.map(w=>`<span class="wchip">${info(w).e} ${w}<i data-del-word="${w}" data-unit="${u.id}">×</i></span>`).join('')
      : '<span style="font-size:13px; color:var(--ink-soft);">还没有单词，去上面录一点吧</span>';
    box.appendChild(div);
  });
  box.querySelectorAll('[data-del-word]').forEach(el=>{
    el.onclick = ()=>{
      const u = S.units.find(x=>x.id===el.dataset.unit);
      if(u){ u.words = u.words.filter(w=>w!==el.dataset.delWord); save(); renderSavedUnits(); }
    };
  });
  box.querySelectorAll('[data-del-unit]').forEach(el=>{
    el.onclick = ()=>{
      if(confirm('删除整个单元？里面的单词也会移除。')){
        S.units = S.units.filter(x=>x.id!==el.dataset.delUnit);
        save(); renderParent();
      }
    };
  });
}

function autoFill(){
  const ta = document.getElementById('wordInput');
  const lines = ta.value.split('\n').map(s=>s.trim().toLowerCase().replace(/\s+/g,' ')).filter(Boolean);
  if(!lines.length){ alert('先输入几行英文单词哦'); return; }
  if(!curUnitId){
    const name = prompt('还没有单元，先建一个吧（例如「Unit 4 · 食物」）');
    if(!name || !name.trim()) return;
    const u = {id:uid(), name:name.trim(), words:[]};
    S.units.push(u); curUnitId = u.id; save();
    renderUnitChips();
  }
  const u = S.units.find(x=>x.id===curUnitId);
  const table = document.getElementById('wordTable');
  table.innerHTML = '';
  let auto = 0, manual = 0;
  const manualWords = [];
  lines.forEach(w=>{
    const key = dictLookup(w);
    const cw = key || w;            // 用词库里的标准写法（如 China）
    const d = key ? DICT[key] : null;
    const row = document.createElement('div');
    row.className = 'wt-row';
    if(d){
      auto++;
      row.innerHTML = `
        <div class="wt-head">
          <span class="wt-en">${d.e} ${cw}</span>
          <span class="wt-phon">${d.p}</span>
          <span class="wt-cn">${d.c}</span>
          <span class="wt-auto">✓ 已自动生成</span>
        </div>
        <div class="hint" style="margin-top:6px;">${d.sc[0][0]}：${d.sc[0][1]}（${d.sc[0][2]}）· 共 ${d.sc.length} 条例句轮换</div>`;
    } else {
      manual++;
      manualWords.push(cw);
      row.innerHTML = `
        <div class="wt-head">
          <span class="wt-en">🔤 ${cw}</span>
          <span class="wt-manual">词库未收录，请补中文</span>
        </div>
        <input placeholder="输入中文意思，例如：书包" data-manual="${cw}">`;
    }
    table.appendChild(row);
    if(!u.words.includes(cw)) u.words.push(cw);
  });
  const summary = document.createElement('div');
  summary.className = 'hint';
  summary.innerHTML = `已存入 <b>${u.name}</b>：${auto} 个自动生成${manual?`，<b style="color:var(--red)">${manual} 个请在上方补中文后点这里 →</b> <button class="chip" id="save-manual">保存补充</button>`:''}`;
  table.appendChild(summary);
  ta.value = '';
  save(); renderSavedUnits();
  const sm = document.getElementById('save-manual');
  if(sm) sm.onclick = ()=>{
    document.querySelectorAll('[data-manual]').forEach(inp=>{
      if(inp.value.trim()){
        const w = inp.dataset.manual;
        S.custom[w] = {c: inp.value.trim()};
        inp.disabled = true;
        const badge = inp.parentElement.querySelector('.wt-manual');
        if(badge){ badge.textContent = '✓ 已保存'; badge.className = 'wt-auto'; }
      }
    });
    save();
  };
}

/* =====================================================================
   启动
===================================================================== */
function renderAll(){ renderHome(); renderUnits(); renderMistake(); renderParent(); }
renderAll();
</script>
